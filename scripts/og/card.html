<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Open Events social card</title>
    <style>
      @font-face {
        font-family: 'Inter Variable';
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
        src: url('../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2')
          format('woff2-variations');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #080808;
        color: #f5f5f5;
        font-family:
          'Inter Variable',
          Inter,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        font-synthesis-weight: none;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        background: #080808;
        overflow: hidden;
      }

      .wash {
        position: absolute;
        inset: 0 0 0 38%;
        background:
          linear-gradient(90deg, #080808 0%, rgb(8 8 8 / 0.18) 28%, rgb(8 8 8 / 0) 52%),
          url('../../public/washes/mesh-dark.jpg') right center / cover no-repeat;
        pointer-events: none;
      }

      .grain {
        position: absolute;
        inset: 0;
        background: url('../../public/washes/grain-dark.jpg') center / cover no-repeat;
        opacity: 0.18;
        mix-blend-mode: overlay;
        pointer-events: none;
      }

      .frame {
        position: absolute;
        inset: 28px;
        border: 1px solid rgb(255 255 255 / 0.09);
        border-radius: 4px;
        pointer-events: none;
      }

      .inner {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 72px 80px 56px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .mark {
        width: 56px;
        height: 56px;
        flex: 0 0 56px;
        border-radius: 14px;
        background: #171717;
        box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.08);
      }

      .word {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .name {
        font-size: 22px;
        font-weight: 560;
        letter-spacing: -0.035em;
        line-height: 1;
        color: #fcfcfc;
      }

      .license {
        font-size: 12px;
        font-weight: 450;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #929292;
      }

      .hero {
        margin-top: auto;
        max-width: 720px;
      }

      .title {
        font-size: 64px;
        font-weight: 560;
        letter-spacing: -0.045em;
        line-height: 1.02;
        color: #fcfcfc;
      }

      .rule {
        width: 48px;
        height: 2px;
        margin: 28px 0 22px;
        background: #1a72cd;
      }

      .lede {
        max-width: 620px;
        font-size: 22px;
        font-weight: 400;
        letter-spacing: -0.018em;
        line-height: 1.35;
        color: #c8c8c8;
      }

      .foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        margin-top: 40px;
      }

      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .pill {
        padding: 6px 11px;
        border: 1px solid rgb(255 255 255 / 0.09);
        border-radius: 999px;
        background: rgb(18 18 18 / 0.72);
        color: #d4d4d4;
        font-size: 13px;
        font-weight: 450;
        letter-spacing: -0.01em;
        line-height: 1;
      }

      .url {
        flex: 0 0 auto;
        color: #929292;
        font-size: 15px;
        font-weight: 450;
        letter-spacing: -0.01em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="wash" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>
      <div class="frame" aria-hidden="true"></div>
      <div class="inner">
        <div class="brand">
          <svg class="mark" viewBox="0 0 64 64" role="img" aria-label="Open Events">
            <rect width="64" height="64" rx="16" fill="#171717" />
            <path d="M18 18h28v7H27v3.5h16v7H27V39h19v7H18V18z" fill="#fff" />
            <circle cx="51" cy="13" r="4.5" fill="#a3e635" />
          </svg>
          <div class="word">
            <div class="name">Open Events</div>
            <div class="license">Apache-2.0</div>
          </div>
        </div>
        <div class="hero">
          <h1 class="title">The event programme,<br />in one place.</h1>
          <div class="rule" aria-hidden="true"></div>
          <p class="lede">
            Call for papers, review, speaker onboarding, agenda, and a public schedule.
          </p>
        </div>
        <div class="foot">
          <div class="pills">
            <span class="pill">Papers</span>
            <span class="pill">Review</span>
            <span class="pill">Speakers</span>
            <span class="pill">Agenda</span>
            <span class="pill">Embeds</span>
          </div>
          <div class="url">openevents.engineer</div>
        </div>
      </div>
    </div>
  </body>
</html>
